[pytest]
# Anchors pytest's rootdir to this directory so it does not climb up to
# the pack root and try to import the (ComfyUI-only) `__init__.py` as
# part of a package. Run from anywhere with:
#     pytest tests/integration -v
# or, if invoked from inside this directory:
#     pytest -v
testpaths = .
addopts = -ra
