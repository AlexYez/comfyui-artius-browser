[project]
name = "comfyui-artius-browser"
description = "Timesaver Artius Browser: lightweight asset browser for modern ComfyUI workflows."
version = "1.14.0"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
readme = "README.md"
dependencies = [
    "blake3>=1.0.5",
    "send2trash>=1.8.3",
    "typing_extensions>=4.8.0",
    # Frontend compatibility, declared the way the Comfy Registry reads it. The
    # frontend can be switched independently of the ComfyUI backend, so state
    # the floor explicitly: 1.42.10 is what ComfyUI 0.19.0 ships, matching the
    # requires-comfyui floor below. Tested up to 1.48.7 (ComfyUI 0.31.1).
    # A LOWER BOUND ONLY, deliberately — an upper bound would let an install
    # downgrade the user's whole ComfyUI frontend. Intentionally absent from
    # requirements.txt for the same reason: that file is what pip actually
    # installs, and this pack must never move a user's frontend.
    "comfyui-frontend-package>=1.42.10",
]

[project.urls]
Repository = "https://github.com/AlexYez/comfyui-artius-browser"
"Bug Tracker" = "https://github.com/AlexYez/comfyui-artius-browser/issues"

[tool.comfy]
PublisherId = "timesaver"
DisplayName = "Timesaver Artius Browser"
Icon = "https://raw.githubusercontent.com/AlexYez/comfyui-artius-browser/refs/heads/main/icon.png"
requires-comfyui = ">=0.19.0"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Correctness-focused baseline the current code already satisfies: pyflakes (F),
# syntax errors (E9) and invalid escape sequences (W605). E402 is intentionally
# not selected — ts_preview.py runs a one-time Pillow-SIMD detection between
# import groups on purpose.
select = ["F", "E9", "W605"]

[tool.mypy]
# Strict typing on a curated allowlist of self-contained modules (see
# scripts/check_release.py TS_MYPY_STRICT_MODULES). follow_imports=silent so a
# not-yet-typed dependency does not fail the check; only the listed modules are
# gated. The set grows as modules are annotated.
python_version = "3.10"
strict = true
follow_imports = "silent"
explicit_package_bases = true
