[project]
name = "comfyui-artius-browser"
description = "Timesaver Artius Browser: lightweight asset browser for modern ComfyUI workflows."
version = "1.7.0"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
readme = "README.md"
dependencies = [
    "blake3>=1.0.5",
    "send2trash>=1.8.3",
    "typing_extensions>=4.8.0",
]

[project.urls]
Repository = "https://github.com/AlexYez/comfyui-artius-browser"
"Bug Tracker" = "https://github.com/AlexYez/comfyui-artius-browser/issues"

[tool.comfy]
PublisherId = "timesaver"
DisplayName = "Timesaver Artius Browser"
Icon = "https://raw.githubusercontent.com/AlexYez/comfyui-artius-browser/refs/heads/main/icon.png"
requires-comfyui = ">=0.19.0"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Correctness-focused baseline the current code already satisfies: pyflakes (F),
# syntax errors (E9) and invalid escape sequences (W605). E402 is intentionally
# not selected — ts_preview.py runs a one-time Pillow-SIMD detection between
# import groups on purpose.
select = ["F", "E9", "W605"]
