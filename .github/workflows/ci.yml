name: CI

# Lightweight checks for the public runtime set (tsab/ + js/). The private test
# and characterization suites live only in the maintainer's working copy, so CI
# verifies what the public repository actually ships: the backend byte-compiles
# and lints clean, and every frontend module parses.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (compile + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Byte-compile the backend
        run: python -m compileall -q tsab __init__.py
      - name: Lint (ruff)
        run: |
          python -m pip install --upgrade pip
          # Pinned: an unpinned "latest" turns a new upstream rule into a
          # red build with no change of ours behind it.
          python -m pip install "ruff==0.15.12"
          python -m ruff check tsab __init__.py

  frontend:
    name: Frontend (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check every frontend module
        run: |
          set -e
          for tsFile in js/*.js; do
            node --check "$tsFile"
          done
