name: E2E

# End-to-end tests against a live ComfyUI on Linux CPU. The job:
#   1. Checks out the pack into a `pack/` subdirectory.
#   2. Clones ComfyUI into `comfyui/`.
#   3. Installs ComfyUI's Python deps with the CPU-only torch index.
#   4. Symlinks the pack into ComfyUI/custom_nodes/.
#   5. Boots ComfyUI in the background and waits for /system_stats.
#   6. Runs pytest integration tests (HTTP surface) and Playwright e2e
#      tests (native node IDs and version endpoint) against the live server.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: live ComfyUI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pack
        uses: actions/checkout@v4
        with:
          path: pack

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read requires-comfyui from pyproject.toml
        id: bound
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re, pathlib
          ts_text = pathlib.Path("pack/pyproject.toml").read_text(encoding="utf-8")
          ts_match = re.search(r'requires-comfyui\s*=\s*"[<>=!~ ]*([0-9][0-9.]*)"', ts_text)
          ts_lower = ts_match.group(1) if ts_match else "0.19.0"
          print(f"lower={ts_lower}")
          PY

      - name: Clone ComfyUI
        run: |
          git clone --depth 1 https://github.com/comfyanonymous/ComfyUI comfyui

      - name: Install ComfyUI dependencies (CPU torch)
        working-directory: comfyui
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Install pack runtime dependencies
        run: |
          pip install -r pack/requirements.txt

      - name: Install pytest dependencies
        run: |
          pip install -r pack/tests/integration/requirements.txt

      - name: Symlink pack into ComfyUI/custom_nodes
        run: |
          ln -s "$GITHUB_WORKSPACE/pack" "$GITHUB_WORKSPACE/comfyui/custom_nodes/comfyui-artius-browser"

      - name: Start ComfyUI in background
        working-directory: comfyui
        run: |
          python main.py --cpu --listen 127.0.0.1 --port 8188 >/tmp/comfyui.log 2>&1 &
          echo $! > /tmp/comfyui.pid

      - name: Wait for ComfyUI to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8188/system_stats >/dev/null 2>&1; then
              echo "ComfyUI ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ComfyUI failed to start within 60s; tail of log:"
          tail -n 200 /tmp/comfyui.log || true
          exit 1

      - name: Verify pack registered with ComfyUI
        run: |
          curl -fs http://127.0.0.1:8188/asset_browser/version
          echo

      - name: Install Playwright browsers
        working-directory: pack/tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run integration tests (pytest)
        env:
          TS_COMFY_URL: http://127.0.0.1:8188
        run: |
          pytest pack/tests/integration -v

      - name: Run e2e tests (Playwright)
        env:
          TS_COMFY_URL: http://127.0.0.1:8188
        working-directory: pack/tests/e2e
        run: |
          npx playwright test

      - name: Stop ComfyUI
        if: always()
        run: |
          if [ -f /tmp/comfyui.pid ]; then
            kill "$(cat /tmp/comfyui.pid)" 2>/dev/null || true
          fi

      - name: Upload ComfyUI log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-log
          path: /tmp/comfyui.log
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pack/tests/e2e/playwright-report
          retention-days: 7
